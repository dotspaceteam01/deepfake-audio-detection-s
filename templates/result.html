<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detection Result</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:linear-gradient(135deg,#020617,#0f172a,#111827);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            overflow:hidden;
        }

        .glow{
            position:absolute;
            width:500px;
            height:500px;
            background:#7c3aed;
            filter:blur(160px);
            opacity:0.2;
            border-radius:50%;
        }

        .container{
            position:relative;
            width:450px;
            padding:45px;
            border-radius:28px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.1);
            box-shadow:0 8px 32px rgba(0,0,0,0.4);
            text-align:center;
            z-index:10;
        }

        .status-icon{
            width:100px;
            height:100px;
            margin:0 auto 25px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:42px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            box-shadow:0 10px 30px rgba(124,58,237,0.4);
        }

        h1{
            font-size:32px;
            margin-bottom:20px;
            font-weight:700;
        }

        .result-box{
            padding:25px;
            border-radius:20px;
            background:rgba(255,255,255,0.05);
            margin-bottom:25px;
            border:1px solid rgba(255,255,255,0.08);
        }

        .result-text{
            font-size:22px;
            font-weight:600;
            color:#60a5fa;
        }

        .description{
            margin-top:12px;
            color:#cbd5e1;
            line-height:1.6;
            font-size:14px;
        }

        .btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s ease;
            box-shadow:0 8px 20px rgba(37,99,235,0.35);
        }

        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 25px rgba(37,99,235,0.45);
        }

        .footer{
            margin-top:22px;
            color:#64748b;
            font-size:12px;
        }

    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">

        <div class="status-icon">
            🔍
        </div>

        <h1>Analysis Complete</h1>

        <div class="result-box">

            <div class="result-text">
                {{ result }}
            </div>

            <!-- <div class="description">
                The uploaded audio has been analyzed using MFCC feature extraction and machine learning classification algorithms.
            </div> -->

        </div>

        <button class="btn" onclick="goBack()">
            Analyze Another Audio
        </button>

        <div class="footer">
            Deepfake Audio Detection System
        </div>

    </div>

    <script>

        function goBack(){
            window.location.href = "/";
        }

    </script>

</body>
</html>
